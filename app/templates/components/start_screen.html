<div id="game-container">
<div class="start-screen">
    <section class="neon-panel" aria-labelledby="start-title">
        <div class="panel-content">
            <h1 id="start-title" class="brand">Soc Ops</h1>
            <p class="subtitle">Social Bingo</p>
            <div class="neon-rule" aria-hidden="true"></div>

            <div class="how-card">
                <h2 class="how-title">How to play</h2>
                <ul class="how-list">
                    <li>Find people who match the questions</li>
                    <li>Tap a square when you find a match</li>
                    <li>Get 5 in a row to win!</li>
                </ul>
            </div>

            <button
                hx-post="/start"
                hx-target="#game-container"
                hx-swap="outerHTML"
                class="neon-btn">
                Start Game
            </button>
        </div>
    </section>
</div>
</div>
